  .caption p{font-size:13px;line-height:1.75;color:#6B7280;}

    box-shadow:0 30px 70px rgba(20,22,26,.16),0 0 0 10px #1A1D21,0 0 0 11px #2C3038;
    display:flex;flex-direction:column;overflow:hidden;position:relative;
  }

  .statusbar{
    height:46px;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 26px 6px;font-size:13px;font-weight:600;color:#14161A;flex:none;
  }
  .statusbar .right{display:flex;gap:5px;align-items:center;font-size:11px;letter-spacing:.5px;}

  .navbar{
    height:44px;display:flex;align-items:center;justify-content:center;
    position:relative;flex:none;background:#fff;
  }
  .navbar__title{font-size:16px;font-weight:600;color:#14161A;}
  .navbar__back{
    position:absolute;left:14px;top:0;height:44px;display:flex;align-items:center;
    font-size:22px;color:#333;cursor:pointer;padding:0 10px;line-height:1;
  }

  .screen{flex:1;overflow-y:auto;overflow-x:hidden;background:var(--bg);}
  .screen::-webkit-scrollbar{width:0;}

  .page{padding:0 14px 28px;}

  .masthead{padding:20px 2px 15px;}
  .masthead__date{font-size:28px;font-weight:700;letter-spacing:-.5px;line-height:1.15;color:#14161A;}
  .masthead__meta{margin-top:7px;display:flex;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);}
  .masthead__meta span+span::before{content:"·";margin:0 6px;color:#C9CED6;}

  .digest{background:var(--card);border-radius:12px;padding:16px;border:1px solid var(--border);
    box-shadow:0 3px 12px rgba(20,22,26,.04);margin-bottom:17px;}
  .digest__label{display:flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:1px;color:var(--red);margin-bottom:8px;}
  .digest__dot{width:5px;height:5px;border-radius:50%;background:var(--red);margin-right:5px;}
  .digest__text{font-size:15.5px;line-height:1.78;color:#23262B;}
  .digest__hint{margin-top:9px;font-size:11px;color:var(--faint);}

  .section__head{display:flex;align-items:baseline;justify-content:space-between;padding:9px 2px 7px;}
  .section__title{font-size:13px;font-weight:600;letter-spacing:1px;color:#4A5058;}
  .section__count{font-size:11px;color:var(--faint);}

  .brief-list{background:var(--card);border-radius:12px;border:1px solid var(--border);overflow:hidden;}
  .brief-item{display:flex;padding:14px 14px 14px 12px;border-bottom:1px solid var(--line);}
  .brief-item:last-child{border-bottom:none;}
  .brief-item__index{flex:none;width:31px;font-size:13px;font-weight:700;color:#D8DCE2;line-height:1.5;letter-spacing:.5px;}
  .brief-item__body{flex:1;min-width:0;}
  .brief-item__title{font-size:15px;line-height:1.62;color:var(--text);}
  .brief-item__children{margin-top:8px;}

  .tag--top{color:#B3261E;background:#FDECEA;}
  .tag--domestic{color:#1F6FEB;background:#EAF1FD;}
  .tag--international{color:#6B5BD2;background:#F0EDFD;}
  .tag--flash{color:#6B7280;background:#F0F2F4;}

  .flash-group{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:14px 14px 10px;margin-bottom:11px;}
  .flash-group__title{font-size:13px;font-weight:600;color:#4A5058;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line);}
  .flash-item{display:flex;padding:5px 0;}
  .flash-item__index{flex:none;width:19px;font-size:12px;color:#C3C9D1;line-height:1.6;}
  .flash-item__text{flex:1;font-size:13.5px;line-height:1.6;color:var(--text-2);}

  .action-row{display:flex;gap:10px;margin-top:17px;}
  .btn{display:flex;align-items:center;justify-content:center;height:42px;border-radius:10px;

  .action-row .btn{flex:1;}
  .btn--primary{background:var(--red);color:#fff;border-color:var(--red);}

  .subscribe__title{font-size:14px;font-weight:600;color:#2A2D33;}
  .subscribe__desc{margin-top:4px;font-size:11px;color:#9AA1AA;}

  .archive-head{display:flex;align-items:baseline;justify-content:space-between;padding:20px 2px 13px;}
  .archive-head__title{font-size:22px;font-weight:700;color:#14161A;letter-spacing:-.3px;}
  .archive-head__count{font-size:11px;color:var(--faint);}

  .archive-item:hover{background:#FAFBFC;}
  .archive-item__date{flex:none;width:38px;text-align:center;padding-right:9px;}
  .archive-item__day{display:block;font-size:19px;font-weight:700;color:#14161A;line-height:1.1;letter-spacing:-.3px;}
  .archive-item__week{display:block;margin-top:2px;font-size:10px;color:var(--faint);}
  .archive-item__body{flex:1;min-width:0;}
  .archive-item__lead{font-size:13.5px;line-height:1.55;color:#2A2D33;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .archive-item__meta{margin-top:4px;font-size:10.5px;color:#B3B9C2;}
  .archive-item__arrow{flex:none;margin-left:6px;font-size:17px;color:#D5D9DF;line-height:1;}

  .panel__row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #F4F6F8;}
  .panel__row:last-child{border-bottom:none;}
  .panel__label{font-size:14px;color:#2A2D33;}
  .panel__value{font-size:13px;color:#6B7280;}

  .panel__value--arrow{color:#D5D9DF;font-size:16px;}

const TAG_CLASS = {
  '总书记':'tag--top','总理':'tag--top','专题':'tag--domestic','评论':'tag--flash',
  '国内':'tag--domestic','国际':'tag--international','快讯':'tag--flash'
};

function tagOf(item){
  const t = item.title || '';
  if(/习近平|总书记/.test(t)) return '总书记';
  if(/李强|总理/.test(t)) return '总理';
  if(/央视快评|本台评论|短评/.test(t)) return '评论';
  if(/【/.test(t)) return '专题';
  if(/快讯/.test(t)) return '快讯';
  if(item.region === 'international') return '国际';
  return '国内';
}
function pad2(n){ return n<10 ? '0'+n : ''+n; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

let state = { tab:'home', detailDate:null };

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('is-on');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('is-on'), 1600);
}

function renderNav(){
  const back = document.getElementById('navBack');
  const title = document.getElementById('navTitle');
  if(state.detailDate){
    back.style.display = 'flex';
    title.textContent = '新闻联播';
  }else{
    back.style.display = 'none';
    title.textContent = '昨日联播';
  }
}

function renderTabs(){
  const tabs = [
    {k:'home', t:'今天'},
    {k:'archive', t:'往期'},
    {k:'settings', t:'我的'}
  ];
  document.getElementById('tabbar').innerHTML = tabs.map(t=>`
    <div class="tabbar__item ${state.tab===t.k && !state.detailDate ?'is-active':''}" onclick="switchTab('${t.k}')">
      <div class="tabbar__dot"></div><span>${t.t}</span>
    </div>`).join('');
}

function switchTab(k){
  state.tab = k; state.detailDate = null;
  render();
}

function openDetail(date){
  state.detailDate = date;
  render();
}

function goBack(){
  state.detailDate = null;
  render();
}

function renderBriefItem(item, i){
  const tag = tagOf(item);
  const kids = (item.children||[]).map((c,j)=>`
    <div class="flash-item">
      <span class="flash-item__index">${j+1}</span>
      <span class="flash-item__text">${esc(c.title)}</span>
    </div>`).join('');
  return `
    <div class="brief-item">
      <div class="brief-item__index">${pad2(i+1)}</div>
      <div class="brief-item__body">
        <div class="brief-item__title">${esc(item.title)}</div>
        <div class="tag ${TAG_CLASS[tag]||'tag--domestic'}">${tag}</div>
        ${kids? `<div class="brief-item__children">${kids}</div>`:''}
      </div>
    </div>`;
}

function renderEditionBody(e){
  const mains = e.mains.map(renderBriefItem).join('');
  const flashes = e.flashes.map(g=>`
    <div class="flash-group">
      <div class="flash-group__title">${esc(g.title)}</div>
      ${(g.children||[]).map((c,i)=>`
        <div class="flash-item">
          <span class="flash-item__index">${i+1}</span>
          <span class="flash-item__text">${esc(c.title)}</span>
        </div>`).join('')}
    </div>`).join('');

  return `
    <div class="page">
      <div class="masthead">
        <div class="masthead__date">${esc(e.displayDate)}</div>
        <div class="masthead__meta">
          <span>${esc(e.weekday)}</span>
          <span>${e.pointCount} 条要点</span>
        </div>
      </div>

      <div class="digest">
        <div class="digest__label"><div class="digest__dot"></div><span>一句话看懂</span></div>
        <div class="digest__text">${esc(e.summary)}</div>
        <div class="digest__hint">由大模型依据联播条目生成</div>
      </div>

      <div class="section__head">
        <span class="section__title">主要内容</span>
        <span class="section__count">${e.mains.length} 条</span>
      </div>
      <div class="brief-list">${mains}</div>

      ${flashes ? `
      <div class="section__head">
        <span class="section__title">联播快讯</span>
        <span class="section__count">${e.flashes.length} 组</span>
      </div>
      ${flashes}` : ''}

      <div class="action-row">
        <div class="btn" onclick="switchTab('archive')">查看往期</div>
        <div class="btn" onclick="toast('原片链接已复制')">复制原片链接</div>
      </div>

      ${state.detailDate ? '' : `
      <div class="subscribe">
        <div class="subscribe__body">
          <div class="subscribe__title">每天早上，收到昨日要点</div>
          <div class="subscribe__desc">微信服务通知，一条一次授权</div>
        </div>
        <div class="subscribe__btn" onclick="toast('已开启订阅')">开启</div>
      </div>`}

      <div class="footer-note">内容整理自央视网《新闻联播》公开节目信息</div>
    </div>`;
}

function renderHome(){
  return renderEditionBody(DATA.editions[0]);
}

function renderArchive(){
  const groups = [];
  let cur = null;
  for(const e of DATA.editions){
    const ym = e.date.slice(0,7);
    if(!cur || cur.ym !== ym){
      cur = { ym, label:`${ym.slice(0,4)}年${Number(ym.slice(5,7))}月`, items:[] };
      groups.push(cur);
    }
    cur.items.push(e);
  }
  const html = groups.map(g=>`
    <div class="month-label">${g.label}</div>
    <div class="archive-card">
      ${g.items.map(e=>{
        const lead = e.mains[0] ? e.mains[0].title : '';
        const short = lead.length>42 ? lead.slice(0,42)+'…' : lead;
        return `<div class="archive-item" onclick="openDetail('${e.date}')">
          <div class="archive-item__date">
            <span class="archive-item__day">${Number(e.date.slice(8,10))}</span>
            <span class="archive-item__week">${esc(e.weekday)}</span>
          </div>
          <div class="archive-item__body">
            <div class="archive-item__lead">${esc(short)}</div>
            <div class="archive-item__meta">${e.pointCount} 条要点</div>
          </div>
          <div class="archive-item__arrow">›</div>
        </div>`;
      }).join('')}
    </div>`).join('');

  return `
    <div class="page">
      <div class="archive-head">
        <span class="archive-head__title">往期回顾</span>
        <span class="archive-head__count">共 ${DATA.editions.length} 期</span>
      </div>
      ${html}
      <div class="footer-note">以上为演示数据，小程序内可继续向前翻</div>
    </div>`;
}

function renderSettings(){
  return `
    <div class="page">
      <div class="masthead"><div class="masthead__date">我的</div></div>

      <div class="panel">
        <div class="panel__row">
          <span class="panel__label">每天早上收到昨日要点</span>
          <span class="panel__value">未开启</span>
        </div>
        <div class="panel__hint">微信的一次性订阅消息：授权一次可收到一条推送。要连续每天收到，可以在收到推送后回来再点一次开启。</div>
        <div class="btn panel__btn" onclick="toast('演示环境未配置模板 ID')">开启每日推送</div>
      </div>

      <div class="panel">
        <div class="panel__row">
          <span class="panel__label">数据来源</span>
          <span class="panel__value panel__value--link" onclick="toast('链接已复制')">央视网 · 新闻联播</span>
        </div>
        <div class="panel__row">
          <span class="panel__label">已加载期数</span>
          <span class="panel__value">${DATA.editions.length} 期</span>
        </div>
        <div class="panel__row">
          <span class="panel__label">最新一期</span>
          <span class="panel__value">${DATA.editions[0].date}</span>
        </div>
        <div class="panel__row">
          <span class="panel__label">清除本地缓存</span>
          <span class="panel__value panel__value--arrow">›</span>
        </div>
      </div>

      <div class="about">
        <div class="about__title">关于这个工具</div>
        <div class="about__text">把每晚《新闻联播》的节目条目整理成一份可以直接扫读的清单，附一句大模型生成的整体概括。条目文字来自央视网公开的节目信息，不含评论与二次加工。</div>
      </div>

      <div class="footer-note">v1.0.0</div>
    </div>`;
}

function render(){
  renderNav();
  renderTabs();
  const screen = document.getElementById('screen');
  let html;
  if(state.detailDate){
    const e = DATA.editions.find(x=>x.date===state.detailDate);
    html = e ? renderEditionBody(e) : '<div class="page"><div class="footer-note">没有找到这一期</div></div>';
  }else if(state.tab==='archive'){
    html = renderArchive();
  }else if(state.tab==='settings'){
    html = renderSettings();
  }else{
    html = renderHome();
  }
  screen.innerHTML = html;
  screen.scrollTop = 0;
}

render();
</script>
